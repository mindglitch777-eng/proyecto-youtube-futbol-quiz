name: Bajar fotos de objetos (Wikimedia)

on:
  push:
    paths: [produccion/assets/pedido_objetos.json, produccion/fotos_objetos.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python3 produccion/fotos_objetos.py
      - name: Guardar fotos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produccion/assets/objetos
          git commit -m "Fotos de objetos de Wikimedia" || echo "nada nuevo"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
