name: Bajar fotos con fecha (Wikimedia)

# Fotos por año de cada jugador para AGE EVOLUTION y PRIME vs NOW.
on:
  push:
    paths: [produccion/assets/pedido_epoca.json, produccion/fotos_epoca.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python3 produccion/fotos_epoca.py
        env:
          SOLO: "Cristiano Ronaldo, Lionel Messi, Luka Modrić, Zlatan Ibrahimović, Karim Benzema, Wayne Rooney, Toni Kroos, Thierry Henry, Steven Gerrard, Ronaldinho, Kaká, Andrés Iniesta, Kylian Mbappé, Gareth Bale, Ángel Di María, Luis Suárez, Neymar"
      - name: Guardar fotos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produccion/assets/fotos_epoca
          git commit -m "Fotos con fecha de Wikimedia" || echo "nada nuevo"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
