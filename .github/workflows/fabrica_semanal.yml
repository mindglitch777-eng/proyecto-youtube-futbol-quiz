name: FÁBRICA semanal (radar → análisis → plan → videos)

# Todos los domingos 09:00 de Argentina arma la semana siguiente completa (28 videos, lunes a domingo).
# También se puede lanzar a mano: Actions → "FÁBRICA semanal" → Run workflow (o editando pipeline/lanzar.txt).
# Los videos quedan en un Release "semana-<lunes>" y el tablero (GitHub Pages) se actualiza solo.

on:
  workflow_dispatch:
    inputs:
      solo_produccion:
        description: "Rehacer solo los videos del plan actual (sin radar, análisis ni plan nuevo)"
        type: boolean
        default: false
  push:
    paths: [pipeline/lanzar.txt]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: {group: fabrica, cancel-in-progress: false}

jobs:
  guardia:                                      # los reintentos del domingo no rehacen una semana ya fabricada hoy
    runs-on: ubuntu-latest
    outputs:
      hecho: ${{ steps.g.outputs.hecho }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          H=$(python3 -c "import json,datetime;e=json.load(open('pipeline/datos/estado.json'))['etapas'].get('produccion',{});print('true' if e.get('estado')=='ok' and (e.get('fin') or '')[:10]==datetime.date.today().isoformat() else 'false')")
          if [ "${{ github.event_name }}" != "schedule" ]; then H=false; fi
          echo "hecho=$H" >> "$GITHUB_OUTPUT"; echo "ya fabricado hoy: $H"

  fabrica:
    needs: guardia
    if: needs.guardia.outputs.hecho != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Herramientas
        run: |
          for i in 1 2 3 4 5; do sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq -o Acquire::Retries=5 --fix-missing ffmpeg libcairo2 fonts-noto-color-emoji && break; echo "apt falló (intento $i), reintento"; sleep $((i * 20)); done
          pip install -q -r pipeline/requirements.txt
          cd produccion/runner && npm install --no-audit --no-fund three@0.169.0 playwright@1.48.0 && npx playwright install --with-deps chromium && cd ../..
          curl -sSL -o produccion/assets/modelos/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSL -o produccion/assets/modelos/lbfmodel.yaml https://raw.githubusercontent.com/kurnianggoro/GSOC2017/master/data/lbfmodel.yaml
      - name: 1 · Radar de virales
        if: ${{ !inputs.solo_produccion }}
        run: cd pipeline && python e1_radar.py
      - name: 2 · Análisis con Gemini (+ grabaciones)
        if: ${{ !inputs.solo_produccion }}
        run: cd pipeline && python e2_analisis.py
      - name: 3 · Nuestro rendimiento
        if: ${{ !inputs.solo_produccion }}
        run: cd pipeline && python e3_rendimiento.py
      - name: 4 · Plan de la semana
        if: ${{ !inputs.solo_produccion }}
        run: cd pipeline && python e4_plan.py
      - name: Guardar avance
        if: ${{ !inputs.solo_produccion }}
        run: bash pipeline/guardar_avance.sh "Fábrica - radar, análisis y plan"
      - name: 5-6 · Producción + control
        run: cd pipeline && python e5_produccion.py
      - name: Publicar la semana como Release
        run: |
          INICIO=$(python -c "import json;print(json.load(open('pipeline/datos/plan.json'))['inicio'])")
          cd produccion/semana_$INICIO
          gh release delete "semana-$INICIO" -y --cleanup-tag 2>/dev/null || true
          gh release create "semana-$INICIO" --target "$GITHUB_REF_NAME" -t "Semana $INICIO" -n "28 videos de la fábrica" ./*.mp4 videos.json CALENDARIO.md
      - name: Guardar avance
        if: always()
        run: bash pipeline/guardar_avance.sh "Fábrica - semana producida"
      - name: Armar tablero
        if: always()
        run: python pipeline/tablero.py
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: {path: _tablero}
      - uses: actions/deploy-pages@v4
        if: always()
        continue-on-error: true
