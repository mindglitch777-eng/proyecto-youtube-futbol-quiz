name: Estudio de competencia (historia completa de los canales virales)

on:
  push:
    paths: [pipeline/estudio_competencia.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estudio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: cd pipeline && python estudio_competencia.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/competencia
          git commit -q -m "Estudio de competencia: videos de los canales virales" || true
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
