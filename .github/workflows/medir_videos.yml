name: Medir shorts (cortes, volumen, hoja de contacto)

# Se corre a mano desde el celular: GitHub → Actions → "Medir shorts" → Run workflow.
# Lee la lista de ids de data/raw/gemini_shorts_targets.json (o la que pongas en "lista").
# Al repo solo se suben métricas y hojas de contacto; los videos se borran en el runner.

on:
  push:
    paths: [research/medir_ids.json]
  workflow_dispatch:
    inputs:
      lista:
        description: "archivo JSON con ids"
        default: "data/raw/gemini_shorts_targets.json"

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q yt-dlp
      - run: python3 research/medir_video.py --lista "${{ inputs.lista || 'research/medir_ids.json' }}"
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/medicion
          git commit -m "Mediciones de shorts" || echo "nada nuevo"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
