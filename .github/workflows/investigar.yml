name: Investigar olas (API de YouTube)

on:
  push:
    paths: [pipeline/investigar_olas.py, pipeline/comentarios.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  olas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: cd pipeline && python comentarios.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/datos/olas.json pipeline/datos/comentarios.json
          git commit -m "Investigación (API YouTube)" || echo "nada nuevo"
          for i in 1 2 3 4; do git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
