name: Investigación automática (mercado + canal + Gemini)

on:
  schedule:
    - cron: "7 20 * * 6"       # sábados 17:07 (Argentina): antes de que arranque la semana
    - cron: "7 20 * * 3"       # miércoles 17:07: control de mitad de semana
  push:
    paths: [pipeline/investigacion_semanal.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: cd pipeline && python investigacion_semanal.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/investigacion_*.md 2>/dev/null; git commit -q -m "Investigación automática: informe" || true
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
          python3 pipeline/guardar_avance.py "Investigación automática"
