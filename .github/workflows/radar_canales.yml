name: Investigación 2.0 diaria (canales seguidos + fuera de serie + Gemini)

on:
  schedule:
    - cron: "7 15 * * *"       # 12:07 de Argentina: el agente IA de las 13:13 ya encuentra el informe nuevo
  push:
    paths: [pipeline/investigar_canales.py]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency: {group: radar-canales, cancel-in-progress: false}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: cd pipeline && python investigar_canales.py
      - name: Investigación plus (olas confirmadas, por qué no explotan, jugadores, público, lista de ideas)
        if: always()
        run: cd pipeline && python investigacion_plus.py
        continue-on-error: true
      - name: Despertador (¿hay una ola para la IA?)
        if: always()
        run: python pipeline/despertador.py || true
      - name: Guardar
        if: always()
        run: |
          python3 pipeline/guardar_avance.py "Investigación 2.0"
          git add reports/dossier 2>/dev/null; git commit -q -m "Investigación 2.0: informe del día" || true
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
