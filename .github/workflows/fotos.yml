name: Bajar fotos libres (Wikimedia)

# Se dispara al cambiar produccion/assets/pedido_fotos.json (lista de jugadores).
# Baja fotos con licencia libre + autor y licencia, y las sube al repo.
on:
  push:
    paths: [produccion/assets/pedido_fotos.json, produccion/fotos_wikimedia.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python3 produccion/fotos_wikimedia.py
      - name: Guardar fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produccion/assets/fotos
          git commit -m "Fotos libres de Wikimedia" || echo "nada nuevo"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
