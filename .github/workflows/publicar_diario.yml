name: PUBLICAR (sube con 3 días de margen + vigía)

# Sube por adelantado (hoy + 3 días) cada video programado a su hora: YouTube los publica solo. También mide el rendimiento
# del canal y actualiza el tablero. Se puede lanzar a mano desde Actions.

on:
  schedule:                    # varias corridas por día: cada una llena el margen de 3 días. Si GitHub saltea alguna, no pasa nada
    - cron: "30 10 * * *"      # (los videos ya están programados dentro de YouTube). Nunca sube dos veces el mismo video.
    - cron: "17 13 * * *"
    - cron: "47 16 * * *"
    - cron: "23 19 * * *"
    - cron: "53 22 * * *"
    - cron: "11 2 * * *"
  workflow_dispatch:
  push:
    paths: [pipeline/probar.txt]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency: {group: publicar, cancel-in-progress: false}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - name: Juntar lo que falta subir (hoy + próximos 3 días)
        run: python pipeline/e6_bajar.py _subir
      - name: Subir a YouTube, cada uno programado a su hora, y vigía
        run: cd pipeline && python e6_publicar.py ../_subir
      - name: Avisar si hay problemas (Issue ALERTA subida, llega por mail y lo ve Claude)
        if: always()
        run: |
          gh label create alerta-subida --color d73a4a --description "Falla en la subida a YouTube" --force >/dev/null 2>&1 || true
          ABIERTO=$(gh issue list --label alerta-subida --state open --json number -q '.[0].number')
          if [ ! -f pipeline/datos/alerta.json ]; then
            echo "La subida se cortó antes de la vigía." > _alerta.md
            OK=False
          else
            OK=$(python -c "import json;print(json.load(open('pipeline/datos/alerta.json'))['ok'])")
            python -c "import json;a=json.load(open('pipeline/datos/alerta.json'));print('Corrida: '+a['hora']+'\n\n'+'\n'.join('- '+p for p in a['problemas'])+'\n\nEn cola: '+', '.join(a['en_cola']))" > _alerta.md
          fi
          echo "$RUN_URL" >> _alerta.md
          if [ "$OK" = "True" ]; then
            [ -n "$ABIERTO" ] && gh issue close "$ABIERTO" -c "Resuelto: la última corrida subió todo bien. $RUN_URL" || true
          elif [ -n "$ABIERTO" ]; then
            gh issue comment "$ABIERTO" -F _alerta.md
          else
            gh issue create -t "ALERTA subida a YouTube" -l alerta-subida -F _alerta.md
          fi
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Medir rendimiento del canal
        run: cd pipeline && python e3_rendimiento.py
        continue-on-error: true
      - name: Analytics de cada video (retención, suscriptores, tráfico)
        run: cd pipeline && python e3b_analytics.py
        continue-on-error: true
      - name: Guardar avance
        if: always()
        run: bash pipeline/guardar_avance.sh "Publicación diaria"
      - name: Armar tablero
        if: always()
        run: python pipeline/tablero.py
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: {path: _tablero}
      - uses: actions/deploy-pages@v4
        if: always()
        continue-on-error: true
