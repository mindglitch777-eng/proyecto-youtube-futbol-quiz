name: Ver virales (Chromium graba la pantalla)

# Se lanza al actualizar pipeline/datos/ver.json (lista de IDs). Abre cada short en Chromium, graba la pantalla
# del navegador y sube los cuadros al repo para analizarlos cuadro por cuadro.

on:
  push:
    paths: [pipeline/datos/ver.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Chromium
        run: |
          pip install -q playwright==1.48.2
          python -m playwright install --with-deps chromium
      - name: Ver
        run: python pipeline/ver_virales.py
      - name: Subir al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pipeline/datos/vistos
          git commit -m "Virales vistos en Chromium" || echo "nada"
          for i in 1 2 3 4; do git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((5 * i)); done
