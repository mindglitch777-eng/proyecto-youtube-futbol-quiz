name: Bajar sonidos de meme (myinstants)

on:
  push:
    paths: [produccion/sonidos_meme.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonidos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python3 produccion/sonidos_meme.py
      - name: Guardar sonidos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produccion/assets/sonidos_meme
          git commit -m "Sonidos de meme (myinstants)" || echo "nada nuevo"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
