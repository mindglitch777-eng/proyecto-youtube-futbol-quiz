<!doctype html>
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head><body>
<script type="module">
// PELOTAS AL HOYO 3D: cancha de estadio con pasto rayado, hoyo con aro dorado y bandera "GOAT", 4 pelotas de fútbol
// (cada una con la cara del jugador flotando arriba y un aro de su color). Python pasa la posición de cada pelota y de la
// cámara en cada cuadro (cfg.cuadros); acá solo se dibuja. Los textos y la carta los compone Python encima.
import * as THREE from "three";

const W = 1080, H = 1920;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H); R.setPixelRatio(1);
R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.15;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

let CFG, scene, cam, bolas = [], caras = [], aros = [], bandera, tela;

function canvasTex(w, h, dib, rep) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; dib(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function texPasto() {             // franjas de corte + ruido
  return canvasTex(512, 512, (g, w, h) => {
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#4fb33c" : "#5fc84a"; g.fillRect(0, i * 64, w, 64); }
    for (let k = 0; k < 9000; k++) { g.fillStyle = `rgba(${20 + Math.random() * 40},${90 + Math.random() * 80},20,.25)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); }
  }, [6, 10]);
}
function texPelota() {            // pelota clásica: blanca con pentágonos negros
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = "#f4f4f4"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#111";
    const pts = [[128, 128], [384, 128], [640, 128], [896, 128], [0, 330], [256, 330], [512, 330], [768, 330], [1024, 330], [128, 490], [640, 490], [384, 40], [896, 40]];
    for (const [x, y] of pts) {
      g.beginPath(); for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; g.lineTo(x + Math.cos(a) * 62, y + Math.sin(a) * 52); } g.closePath(); g.fill();
    }
    g.strokeStyle = "#999"; g.lineWidth = 3;
    for (const [x, y] of pts) for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; g.beginPath(); g.moveTo(x + Math.cos(a) * 62, y + Math.sin(a) * 52); g.lineTo(x + Math.cos(a) * 125, y + Math.sin(a) * 105); g.stroke(); }
  });
}
function texTribuna() {           // hinchada: puntitos de colores + techo, para el cilindro del estadio
  return canvasTex(2048, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#1b2240"); gr.addColorStop(1, "#3a3f63"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const cols = ["#e94b4b", "#f2f2f2", "#3d7bf0", "#ffd23f", "#2ec27e", "#ff8c2b"];
    for (let k = 0; k < 26000; k++) { g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.globalAlpha = .35 + Math.random() * .35; g.fillRect(Math.random() * w, 90 + Math.random() * (h - 120), 3, 4); }
    g.globalAlpha = 1; g.fillStyle = "#0e1226"; g.fillRect(0, 0, w, 80);
    for (let x = 30; x < w; x += 180) { g.fillStyle = "#fff8d0"; g.fillRect(x, 40, 60, 22); }
  });
}
function texBandera() {
  return canvasTex(512, 320, (g, w, h) => {
    g.fillStyle = "#ffcf2e"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#3b2600"; g.font = "bold 150px Impact, Anton, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("GOAT", w / 2, h / 2 + 6);
  });
}
function texCara(img, color) {    // cara en círculo con aro del color del jugador
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = color; g.beginPath(); g.arc(256, 256, 250, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(256, 256, 222, 0, 7); g.clip();
    if (img) g.drawImage(img, 34, 34, 444, 444); g.restore();
  });
}

function armar(cfg) {
  scene = new THREE.Scene();
  scene.background = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#5aa8ff"); gr.addColorStop(1, "#cfe8ff"); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.fog = new THREE.Fog(0xcfe8ff, 60, 140);
  cam = new THREE.PerspectiveCamera(60, W / H, 0.1, 400);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.1));
  const sol = new THREE.DirectionalLight(0xffffff, 2.4); sol.position.set(12, 30, 14); sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -25, right: 25, top: 25, bottom: -45, near: 1, far: 90 }); sol.target.position.set(0, 0, -15);
  scene.add(sol, sol.target);
  // cancha con el hoyo (anillo de pasto alrededor de un agujero)
  const piso = new THREE.Shape(); piso.moveTo(-60, -40); piso.lineTo(60, -40); piso.lineTo(60, 110); piso.lineTo(-60, 110); piso.closePath();
  const agujero = new THREE.Path(); agujero.absarc(cfg.hoyo[0], -cfg.hoyo[1], cfg.r_hoyo, 0, Math.PI * 2, true); piso.holes.push(agujero);
  const geo = new THREE.ShapeGeometry(piso, 64); geo.rotateX(-Math.PI / 2);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 20, uv.getY(i) / 15);
  const pasto = texPasto(); pasto.repeat.set(1, 1);
  const suelo = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: pasto, roughness: .95 })); suelo.receiveShadow = true; scene.add(suelo);
  // líneas blancas de cancha
  const lineaMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const z of [5, -55]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(40, .25), lineaMat); l.rotation.x = -Math.PI / 2; l.position.set(0, .01, z); scene.add(l); }
  // hoyo: tubo oscuro + aro dorado brillante
  const tubo = new THREE.Mesh(new THREE.CylinderGeometry(cfg.r_hoyo, cfg.r_hoyo, 3, 48, 1, true), new THREE.MeshStandardMaterial({ color: 0x1a1208, side: THREE.BackSide }));
  tubo.position.set(cfg.hoyo[0], -1.5, cfg.hoyo[1]); scene.add(tubo);
  const fondo = new THREE.Mesh(new THREE.CircleGeometry(cfg.r_hoyo, 32), new THREE.MeshBasicMaterial({ color: 0x050302 })); fondo.rotation.x = -Math.PI / 2; fondo.position.set(cfg.hoyo[0], -2.9, cfg.hoyo[1]); scene.add(fondo);
  const aro = new THREE.Mesh(new THREE.TorusGeometry(cfg.r_hoyo + .05, .12, 12, 64), new THREE.MeshStandardMaterial({ color: 0xffc928, emissive: 0xffa600, emissiveIntensity: .9, metalness: .6, roughness: .3 }));
  aro.rotation.x = -Math.PI / 2; aro.position.set(cfg.hoyo[0], .04, cfg.hoyo[1]); scene.add(aro);
  // bandera GOAT
  const palo = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 6, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  palo.position.set(cfg.hoyo[0] + cfg.r_hoyo + 0.9, 3, cfg.hoyo[1] - 1.2); palo.castShadow = true; scene.add(palo);
  const telaGeo = new THREE.PlaneGeometry(2.6, 1.6, 20, 6);
  tela = new THREE.Mesh(telaGeo, new THREE.MeshStandardMaterial({ map: texBandera(), side: THREE.DoubleSide }));
  tela.position.set(palo.position.x + 1.3, 5.1, palo.position.z); tela.castShadow = true; scene.add(tela);
  tela.userData.base = telaGeo.attributes.position.array.slice();
  // estadio: cilindro de tribunas + reflectores
  const trib = new THREE.Mesh(new THREE.CylinderGeometry(95, 80, 34, 64, 1, true), new THREE.MeshBasicMaterial({ map: texTribuna(), side: THREE.BackSide }));
  trib.material.map.wrapS = THREE.RepeatWrapping; trib.material.map.repeat.set(3, 1);
  trib.position.set(0, 14, -20); scene.add(trib);
  for (const [x, z] of [[-60, -80], [60, -80], [-70, 20], [70, 20]]) {
    const luz = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64); gr.addColorStop(0, "rgba(255,255,240,1)"); gr.addColorStop(.3, "rgba(255,250,200,.7)"); gr.addColorStop(1, "rgba(255,250,200,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }), depthWrite: false }));
    luz.scale.set(26, 26, 1); luz.position.set(x, 40, z); scene.add(luz);
  }
  // pelotas + caras + aros de color
  const tp = texPelota();
  cfg.jugadores.forEach((j, i) => {
    const b = new THREE.Mesh(new THREE.SphereGeometry(cfg.r_bola, 48, 32), new THREE.MeshStandardMaterial({ map: tp, roughness: .45 }));
    b.castShadow = true; scene.add(b); bolas.push(b);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texCara(j.img, j.color), depthTest: false }));
    s.scale.set(cfg.r_bola * 2.3, cfg.r_bola * 2.3, 1); s.renderOrder = 10; scene.add(s); caras.push(s);
    const a = new THREE.Mesh(new THREE.RingGeometry(cfg.r_bola * 1.05, cfg.r_bola * 1.45, 40), new THREE.MeshBasicMaterial({ color: j.color, transparent: true, opacity: .85 }));
    a.rotation.x = -Math.PI / 2; scene.add(a); aros.push(a);
  });
}

function frame(k) {
  const c = CFG.cuadros[Math.min(k, CFG.cuadros.length - 1)];
  cam.position.set(c.cam[0], c.cam[1], c.cam[2]); cam.lookAt(c.cam[3], c.cam[4], c.cam[5]);
  c.bolas.forEach((p, i) => {
    const b = bolas[i], prev = b.userData.prev;
    b.position.set(p[0], p[1], p[2]); b.visible = p[3] > 0;
    if (prev) {                                                  // rodar: girar sobre el eje perpendicular al avance
      const dx = p[0] - prev[0], dz = p[2] - prev[2], dist = Math.hypot(dx, dz);
      if (dist > 1e-5) b.rotateOnWorldAxis(new THREE.Vector3(dz, 0, -dx).normalize(), dist / CFG.r_bola);
    }
    b.userData.prev = p;
    caras[i].position.set(p[0], p[1] + CFG.r_bola * 2.6, p[2]); caras[i].visible = p[3] > 0 && p[1] > -CFG.r_bola;
    caras[i].material.opacity = p[3]; caras[i].material.transparent = true;
    aros[i].position.set(p[0], .03, p[2]); aros[i].visible = p[1] > -.2 && p[3] > 0;
  });
  const pos = tela.geometry.attributes.position, base = tela.userData.base, t = k / CFG.fps;   // bandera flameando
  for (let i = 0; i < pos.count; i++) { const x = base[i * 3]; pos.setZ(i, Math.sin(x * 2.2 - t * 7) * .18 * (x + 1.3) / 2.6); }
  pos.needsUpdate = true;
  R.render(scene, cam);
  return R.domElement.toDataURL("image/jpeg", 0.93);
}

window.iniciar = async (cfg) => {
  CFG = cfg;
  await Promise.all(cfg.jugadores.map(j => new Promise(ok => { const i = new Image(); i.onload = () => { j.img = i; ok(); }; i.onerror = ok; i.src = j.cara; })));
  armar(cfg);
};
window.frame = (t) => frame(Math.round(t * CFG.fps));
</script>
</body></html>
